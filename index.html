<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 20px; background: #f4f7f6; }
        #card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .data { font-size: 1.4em; font-weight: bold; color: #2c3e50; margin: 15px 0; }
        .label { color: #7f8c8d; font-size: 0.8em; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="card">Loading Data...</div>
    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQyjqN-bcWsJJ9ahHppOt0GbjBAQcGfXneArZ1JsgNhlGRl9AuVDQukoslVwxGuLzhQycQSYC_TR49L/pub?gid=0&single=true&output=csv";
        const params = new URLSearchParams(window.location.search);
        const rowNum = parseInt(params.get('row')) || 1;

        async function fetchData() {
            // Adding a timestamp (?_=[time]) forces the browser to bypass any cache
            const cacheBuster = "&_cache=" + new Date().getTime();
            const resp = await fetch(csvUrl + cacheBuster);
            const text = await resp.text();
            
            const rows = text.split(/\r?\n/).map(r => r.split(','));
            const dataRow = rows[rowNum - 1];

            if (dataRow) {
                document.getElementById('card').innerHTML = `
                    <div class="title">La Boutique</div><br>
                    <div class="label">Product</div><div class="data">${dataRow[1] || ''}</div>
                    <div class="label">Price</div><div class="data">${dataRow[2] || ''}</div>
                `;
            } else {
                document.getElementById('card').innerHTML = "No data found.";
            }
        }
        fetchData();
    </script>
</body>
</html>
